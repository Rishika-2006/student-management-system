{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Add Student</h2>

<form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Roll Number</label>
        <input type="text" name="roll_no" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Maths</label>
        <input type="number" name="maths" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Science</label>
        <input type="number" name="science" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>English</label>
        <input type="number" name="english" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Attendance (%)</label>
        <input type="number" name="attendance" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">
        Add Student
    </button>

</form>

{% endblock %}
